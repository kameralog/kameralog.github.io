<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор художников</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#25352d;font:16px/1.5 system-ui}header{background:#173a32;color:white;padding:18px}h1{margin:0;font-size:24px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:white}button,input,textarea,select{font:inherit;border:1px solid #acb9ae;border-radius:6px;padding:8px}button{cursor:pointer;background:white}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;background:white}textarea{min-height:145px}label{display:block;font-weight:600;margin-top:18px}.layout{display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:auto}aside{padding:15px;max-height:80vh;overflow:auto}main{padding:20px;min-width:0}.item{display:block;width:100%;text-align:left;margin:7px 0}.active{border:2px solid #173a32}.box{background:white;padding:15px;border-radius:8px;margin:15px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.primary{background:#173a32;color:white}small{color:#627166}a{color:#175b42}#notice{padding:12px;background:#fff0c8}pre{white-space:pre-wrap}#file{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{max-height:230px}}</style><header><h1>Редактор художников — реальный каталог</h1><div id="connection">Каталог ещё не загружен</div></header><nav><button id="sync">Обновить каталог</button><button id="import">Импорт досье</button><button id="export">Экспорт утверждённых</button><button id="research">Экспорт доисследования</button><button id="backup">Резервная копия</button><button id="restore">Восстановить копию</button><input id="file" type="file" accept=".json"><button disabled>Отправка в GitHub — пока не подключена</button></nav><div id="notice" role="status">Импорт каталога не означает, что исследования уже выполнены. Правки хранятся в этом браузере.</div><div class="layout"><aside><input id="search" placeholder="Поиск художника" aria-label="Поиск"><select id="filter" aria-label="Состояние"><option value="all">Все</option><option value="unresearched">Нет досье</option><option value="review">К просмотру</option><option value="research">На доисследовании</option><option value="returned">После исследования</option><option value="approved">Утверждено</option><option value="skipped">Пропущено</option></select><p id="count"></p><div id="list"></div></aside><main id="editor"></main></div><script>
'use strict';
const KEY='painting-editor-v02',labels={unresearched:'Нет досье',review:'К просмотру',research:'На доисследовании',returned:'После исследования',approved:'Утверждено',skipped:'Пропущено'};
let catalogue=[],meta={},local={drafts:{},dossiers:{},current:null},mode='dossier';
const $=s=>document.querySelector(s),make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.drafts&&v.dossiers)local=v}catch(e){}
const say=s=>$('#notice').textContent=s;
function save(){try{localStorage.setItem(KEY,JSON.stringify(local))}catch(e){say('Ошибка сохранения: сделайте резервную копию. '+e.message)}}
function state(a){return local.drafts[a.id]?.status||(local.dossiers[a.id]?'review':'unresearched')}
function list(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;return catalogue.filter(a=>(a.name+' '+a.id).toLowerCase().includes(q)&&(f==='all'||state(a)===f))}
function draft(a){return local.drafts[a.id]||(local.drafts[a.id]={customDirection:'',synopsis:local.dossiers[a.id]?.synopsis||'',researchNote:'',selectedDirection:'',status:state(a),revision:0})}
function renderList(){const items=list();$('#count').textContent=items.length+' / '+catalogue.length+' · утверждено '+catalogue.filter(a=>state(a)==='approved').length;$('#list').replaceChildren();for(const a of items){const b=make('button',a.name+' — '+labels[state(a)]);b.className='item'+(a.id===local.current?' active':'');b.onclick=()=>{local.current=a.id;save();render()};$('#list').append(b)}}
function field(a,key,title){const d=draft(a),label=make('label',title),t=make('textarea');t.value=d[key]||'';t.oninput=()=>{d[key]=t.value;d.revision++;d.updatedAt=new Date().toISOString();if(d.status==='approved')d.status='review';save();renderList()};return [label,t]}
function next(a,status){const d=draft(a),dos=local.dossiers[a.id];if(status==='approved'&&(!d.synopsis.trim()||(!d.customDirection.trim()&&!d.selectedDirection))){say('Заполните направление и синопсис.');return}if(status==='research'&&!d.customDirection.trim()&&!d.researchNote.trim()){say('Напишите вопрос или своё направление.');return}const items=list(),i=items.findIndex(x=>x.id===a.id);d.status=status;d.revision++;d.updatedAt=new Date().toISOString();local.current=(items[i+1]||items.find(x=>x.id!==a.id)||a).id;save();render()}
function render(){renderList();const host=$('#editor');host.replaceChildren();const a=catalogue.find(a=>a.id===local.current);if(!a){host.append(make('p','Выберите художника. Если список пуст, нажмите «Обновить каталог».'));return}const d=draft(a),dos=local.dossiers[a.id];host.append(make('h2',a.name),make('p',[a.latin,a.life,a.tag].filter(Boolean).join(' · ')),make('small','ID: '+a.id+' · '+labels[state(a)]));const old=make('details');old.className='box';old.append(make('summary','Нынешний текст сайта и произведения'));for(const p of a.existing?.bio||[])old.append(make('p',p));for(const p of a.existing?.technique||[])old.append(make('p',p));if(a.existing?.innovation)old.append(make('p',a.existing.innovation));for(const w of a.works||[])old.append(make('p',[w.title,w.date,w.museum].filter(Boolean).join(' · ')));host.append(old);const choices=make('section');choices.className='box';choices.append(make('h3','Направления из исследовательского досье'));if(!dos)choices.append(make('p','Досье ещё нет. Это импорт исходной карточки, а не результат нового исследования.'));for(const x of dos?.directions||[]){const b=make('button',x.title+(x.description?' — '+x.description:''));b.style.margin='5px';if(d.selectedDirection===x.id)b.className='active';b.onclick=()=>{d.selectedDirection=x.id;d.revision++;if(d.status==='approved')d.status='review';save();render()};choices.append(b)}host.append(choices,...field(a,'customDirection','Своё направление — приоритетнее предложенных'),...field(a,'synopsis','Ваш синопсис'),...field(a,'researchNote','Вопросы для доисследования'));if(dos?.synopsis){const proposed=make('details');proposed.className='box';proposed.append(make('summary','Предложенный синопсис — не заменяет вашу редакцию'),make('p',dos.synopsis));const use=make('button','Взять предложенный синопсис');use.onclick=()=>{if(d.synopsis&&!confirm('Заменить вашу редакцию предложенным синопсисом?'))return;d.synopsis=dos.synopsis;d.status='review';d.revision++;save();render()};proposed.append(use);host.append(proposed)}const sources=make('details');sources.className='box';sources.append(make('summary','Источники'));for(const s of [...(a.sources||[]),...(dos?.sources||[])]){try{const u=new URL(s.url);if(!['https:','http:'].includes(u.protocol))continue;const p=make('p'),link=make('a',s.title||s.url);link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';p.append(link);sources.append(p)}catch(e){}}host.append(sources);const actions=make('div');actions.className='actions';for(const [text,status]of [['Утвердить и дальше','approved'],['Доисследовать и дальше','research'],['Пропустить','skipped']]){const b=make('button',text);if(status==='approved')b.className='primary';b.onclick=()=>next(a,status);actions.append(b)}host.append(actions)}
async function sync(){const b=$('#sync');b.disabled=true;try{const r=await fetch(new URL('catalogue.json',location.href),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();if(v.schemaVersion!==1||!Array.isArray(v.artists)||!v.artists.length)throw Error('Неверный формат каталога');const ids=new Set;for(const a of v.artists){if(!a.id||!a.name||ids.has(a.id))throw Error('Неверный или повторный ID');ids.add(a.id)}catalogue=v.artists;meta={sourceCommit:v.sourceCommit};if(!ids.has(local.current))local.current=catalogue[0].id;save();$('#connection').textContent='Карточек: '+catalogue.length+' · снимок '+v.sourceCommit.slice(0,7);say('Каталог загружен. Ваши правки сохранены. Автоматический поиск и запись в GitHub не подключены.');render()}catch(e){say('Каталог не загружен: '+e.message+'. Экспорт мог ещё не завершиться. Повторите обновление позже.')}finally{b.disabled=false}}
function download(name,data){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=make('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function packet(status,kind){const artists=catalogue.filter(a=>state(a)===status).map(a=>{const d=draft(a),dos=local.dossiers[a.id];return {id:a.id,name:a.name,...d,mainDirection:d.customDirection.trim()||dos?.directions?.find(x=>x.id===d.selectedDirection)?.title||'',sources:dos?.sources||a.sources||[],dossier:dos||null}});if(!artists.length){say('Подходящих заданий нет.');return}download(kind+'.json',{schemaVersion:1,kind,...meta,exportedAt:new Date().toISOString(),artists});say('Файл экспортирован. В GitHub ничего не отправлено.')}
$('#sync').onclick=sync;$('#search').oninput=renderList;$('#filter').onchange=renderList;$('#export').onclick=()=>packet('approved','approved-editorial-briefs');$('#research').onclick=()=>packet('research','research-requests');$('#backup').onclick=()=>download('painting-editor-backup-v02.json',{schemaVersion:2,...local});$('#import').onclick=()=>{mode='dossier';$('#file').click()};$('#restore').onclick=()=>{mode='restore';$('#file').click()};
$('#file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const v=JSON.parse(await file.text());if(mode==='restore'){if(v.schemaVersion!==2||!v.drafts||!v.dossiers)throw Error('Нужна резервная копия версии 0.2');if(!confirm('Заменить локальные правки резервной копией?'))return;local={drafts:v.drafts,dossiers:v.dossiers,current:v.current};}else{if(v.schemaVersion!==1||!Array.isArray(v.artists))throw Error('Нужен массив artists');if(!catalogue.length)throw Error('Сначала загрузите каталог');for(const a of v.artists){if(!catalogue.some(x=>x.id===a.id))throw Error('Неизвестный ID: '+a.id);if(a.directions&&!Array.isArray(a.directions))throw Error('Неверный формат directions')}for(const a of v.artists){local.dossiers[a.id]=a;const d=local.drafts[a.id];if(d?.status==='research')d.status='returned';else if(d?.status==='unresearched')d.status='review';}}save();render();say('Загружено. При импорте досье ваши синопсисы не перезаписываются.')}catch(err){say('Импорт не выполнен: '+err.message)}finally{e.target.value=''}};
render();sync();
</script></html>
