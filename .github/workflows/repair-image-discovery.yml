name: Repair museum image discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-image-discovery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-image-discovery
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded candidate retention repair
        run: |
          python3 <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('games/painting/discover-painting-images.mjs')
          s=p.read_text()
          if "POLICY='image-discovery-v3'" in s:
              raise SystemExit('Already repaired; no changes')
          blob=hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()
          assert blob=='af8ac6ddb2cf1c3e554ab3addd27821730891eea','Search changed; refusing to overwrite'
          def once(a,b):
              global s
              assert s.count(a)==1,'Changed anchor: '+a[:80]
              s=s.replace(a,b)
          once("POLICY='image-discovery-v2'","POLICY='image-discovery-v3'")
          once("if(c.provider==='commons'&&!c.sourceLinkMatch)continue;","if(c.provider==='commons'){c.identityTier=c.sourceLinkMatch?'museum_link_candidate':'unverified_search_candidate';if(!c.sourceLinkMatch)c.identityBasis='unverified_search_result';}")
          once("c.caution=c.partial?'File name indicates a fragment/crop; preserve this note.':'';","c.caution=[c.partial?'File name indicates a fragment/crop; preserve this note.':'',c.identityTier==='unverified_search_candidate'?'No matching museum link: artist, work and museum identity are NOT confirmed; keep only for separate review.':''].filter(Boolean).join(' ');")
          once("gsrsearch:q,gsrlimit:3,","gsrsearch:q,gsrlimit:10,")
          once("if(!unique.has(id)||c.exact&&!unique.get(id).exact)unique.set(id,c);","if(!unique.has(id)||c.exact&&!unique.get(id).exact||c.sourceLinkMatch&&!unique.get(id).sourceLinkMatch)unique.set(id,c);")
          once("Work candidates with a source require the same object URL; missing links require separate review.","Commons candidates with matching museum links and unverified search candidates are retained in distinct identity tiers; neither is visually confirmed. Up to 10 title/artist results are checked.")
          p.write_text(s)
          PY
      - name: Existing tests
        run: |
          node --check games/painting/discover-painting-images.mjs
          node games/painting/test-discover-painting-images.mjs
      - name: Test separate review tiers and safety
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {discover,allowedURL} from './games/painting/discover-painting-images.mjs';
          const t={id:'tiers',kind:'work',key:'uffizi:test',source:'https://www.uffizi.it/en/artworks/test',title:'Test',originalTitle:'Test',artist:'Artist',aliases:['Artist']};
          const page=(name,url,source,thumb)=>({title:'File:'+name,imageinfo:[{url,thumburl:thumb,extmetadata:{Source:{value:source},LicenseShortName:{value:'Public domain'}}}]});
          const net={json:async url=>{assert(url.startsWith('https://commons.wikimedia.org/'));return {query:{pages:[page('Linked.jpg','https://upload.wikimedia.org/linked.jpg',t.source,'https://untrusted.invalid/thumb.jpg'),page('Review.jpg','https://upload.wikimedia.org/review.jpg',''),page('Unsafe.jpg','https://127.0.0.1/private',t.source)]}};},probe:async url=>{allowedURL(url);return {ok:true};}};
          const r=await discover(t,net);
          assert.equal(r.candidates.length,2);
          const linked=r.candidates.find(c=>c.sourceLinkMatch),review=r.candidates.find(c=>!c.sourceLinkMatch);
          assert.equal(linked.identityTier,'museum_link_candidate');
          assert.equal(review.identityTier,'unverified_search_candidate');
          assert.equal(review.identityBasis,'unverified_search_result');
          assert(review.caution.includes('NOT confirmed'));
          for(const c of r.candidates){assert.equal(c.exact,false);assert.equal(c.status,'needs_identity_review');}
          assert.equal(linked.image,'https://upload.wikimedia.org/linked.jpg');
          assert(r.errors.some(e=>e.source==='commons-file'));
          assert.equal(r.visualReviewPerformed,false);
          assert.equal(r.gameFilesModified,false);
          assert.throws(()=>allowedURL('https://127.0.0.1/private'));
          console.log('Separate candidate tiers, retained unverified results, museum routing and URL safety passed');
          NODE
      - name: Commit only tested search change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/painting/discover-painting-images.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Retain Commons candidates without museum links for separate review'
            git push origin HEAD:main
          fi
