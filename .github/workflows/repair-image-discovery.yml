name: Repair museum image discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-image-discovery.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-image-discovery
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded repair
        run: |
          python3 <<'PY'
          import hashlib, pathlib
          p=pathlib.Path('games/painting/discover-painting-images.mjs')
          s=p.read_text()
          if "POLICY='image-discovery-v2'" in s:
              raise SystemExit('Already repaired; nothing to overwrite')
          blob=hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()
          assert blob=='929aef887292ca47f6bc8920ccafefa2bc440839','Search changed; stop rather than overwrite'
          def once(a,b):
              global s
              assert s.count(a)==1, 'Changed repair anchor: '+a[:80]
              s=s.replace(a,b)
          once("POLICY='image-discovery-v1'","POLICY='image-discovery-v2'")
          once("const image=i.thumburl||i.url;allowedURL(image);","allowedURL(i.url);let image=i.thumburl||i.url;try{allowedURL(image);}catch{image=i.url;}")
          once("await attempt('aic-search',","if(t.kind!=='work'||!t.source||d?.provider==='aic')await attempt('aic-search',")
          once("await attempt('cma-search',","if(t.kind!=='work'||!t.source||d?.provider==='cma')await attempt('cma-search',")
          once("return (j.query?.pages||[]).map(p=>commonsCandidate(p,t));","const out=[];for(const p of j.query?.pages||[]){try{const c=commonsCandidate(p,t);if(c)out.push(c);}catch(e){errors.push({source:'commons-file',file:p.title||'',error:e.message});}}return out;")
          once("await attempt('commons-search',async()=>{","if(t.kind==='work'&&t.source)await attempt('commons-source-link',async()=>{const j=await net.json(endpoint('https://commons.wikimedia.org/w/api.php',{action:'query',format:'json',formatversion:2,generator:'search',gsrnamespace:6,gsrsearch:'\"'+t.source.replaceAll('\"','')+'\"',gsrlimit:5,prop:'imageinfo',iiprop:'url|size|sha1|extmetadata',iiurlwidth:1000}));const out=[];for(const p of j.query?.pages||[]){try{const c=commonsCandidate(p,t);if(c&&c.sourceLinkMatch)out.push(c);}catch(e){errors.push({source:'commons-file',file:p.title||'',error:e.message});}}return out;});\n  await attempt('commons-search',async()=>{")
          once("for(const c of candidates){const id=imageIdentity(c.zoom||c.image);","for(const c of candidates){if(t.kind==='work'&&t.source){if(c.provider==='commons'&&!c.sourceLinkMatch)continue;if(['aic','cma'].includes(c.provider)&&!c.exact&&canonical(c.source)!==canonical(t.source))continue;}const id=imageIdentity(c.zoom||c.image);")
          once("AIC/CMA direct lookup where supported; first 2 AIC, 2 CMA and 3 Commons search results. No exhaustive-world-search claim.","AIC/CMA only for matching museum or unscoped tasks; Commons exact source-link search plus title/artist search. Work candidates with a source require the same object URL; missing links require separate review. No exhaustive-world-search claim.")
          p.write_text(s)
          PY
      - name: Syntax and existing regression tests
        run: |
          node --check games/painting/discover-painting-images.mjs
          node games/painting/test-discover-painting-images.mjs
      - name: Test museum isolation and Commons fallback
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {discover,allowedURL} from './games/painting/discover-painting-images.mjs';
          const t={id:'regression',kind:'work',key:'uffizi:test',source:'https://www.uffizi.it/en/artworks/test',title:'Test',originalTitle:'Test',artist:'Artist',aliases:['Artist']};
          const page=(title,original,thumb,source)=>({title,imageinfo:[{url:original,thumburl:thumb,descriptionurl:'https://commons.wikimedia.org/wiki/File:Test.jpg',extmetadata:{Source:{value:source},LicenseShortName:{value:'Public domain'}}}]});
          const calls=[];
          const net={json:async url=>{calls.push(url);assert(url.startsWith('https://commons.wikimedia.org/'));return {query:{pages:[page('File:Good.jpg','https://upload.wikimedia.org/good.jpg','https://untrusted.invalid/thumb.jpg',t.source),page('File:Other.jpg','https://upload.wikimedia.org/other.jpg',null,'https://other.invalid/art/1'),page('File:Blocked.jpg','https://127.0.0.1/private',null,t.source)]}};},probe:async url=>{assert.equal(url,'https://upload.wikimedia.org/good.jpg');return {ok:true};}};
          const r=await discover(t,net);
          assert.equal(r.candidates.length,1);
          assert.equal(r.candidates[0].image,'https://upload.wikimedia.org/good.jpg');
          assert.equal(r.candidates[0].exact,false);
          assert.equal(r.candidates[0].status,'needs_identity_review');
          assert(r.errors.some(e=>e.source==='commons-file'));
          assert.equal(r.status,'incomplete');
          assert(calls.some(url=>new URL(url).searchParams.get('gsrsearch').includes(t.source)));
          assert.throws(()=>allowedURL('https://127.0.0.1/private'));
          console.log('Museum isolation, source link, per-file failure, original fallback and URL safety passed');
          NODE
      - name: Commit only repaired search
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- games/painting/discover-painting-images.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Fix museum routing and isolate Commons image URL failures'
            git push origin HEAD:main
          fi
