name: Review Uffizi candidates in batches of 50
on:
  push:
    branches: [main]
    paths: ['.github/workflows/review-uffizi-batch.yml']
  workflow_dispatch:
    inputs:
      batch:
        description: Batch number, 1 to 10
        type: number
        default: 1
permissions:
  contents: write
concurrency:
  group: save-museum-reports
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: museum-reports
          path: audit-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install decoder outside repository
        run: npm install --prefix "$RUNNER_TEMP/uffizi-decoder" --no-save --package-lock=false sharp@0.33.5
      - name: Assess one batch with separate evidence categories
        env:
          BATCH: ${{ inputs.batch || 1 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {execFileSync} from 'node:child_process';
          import {Network,commonsRights} from './games/painting/discover-painting-images.mjs';
          const sharp=createRequire(import.meta.url)(process.env.RUNNER_TEMP+'/uffizi-decoder/node_modules/sharp');
          const PAINTING='Q3305213',batch=Number(process.env.BATCH);assert(Number.isInteger(batch)&&batch>=1&&batch<=10);
          const norm=s=>String(s||'').normalize('NFKD').replace(/\p{M}/gu,'').toLowerCase().replaceAll('ё','е').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
          const file=s=>String(s||'').replaceAll('_',' ').trim();
          const active=(e,p)=>(e?.claims?.[p]||[]).filter(c=>c.rank!=='deprecated'&&!c.qualifiers?.P582);
          const values=(e,p)=>active(e,p).map(c=>c.mainsnak?.datavalue?.value);
          const isPainting=e=>values(e,'P31').some(v=>v?.id===PAINTING);
          assert(isPainting({claims:{P31:[{mainsnak:{datavalue:{value:{id:'Q3305213'}}}}]}}));
          assert(!isPainting({claims:{P31:[{mainsnak:{datavalue:{value:{id:'Q330521'}}}}]}}));
          const base='audit-source/reports/uffizi-duplicates/43459074306-1',pkg='audit-source/reports/uffizi-packages/43457577858-1';
          const manifest=JSON.parse(fs.readFileSync(base+'/summary.json'));assert(manifest.complete&&manifest.processed===495);
          const queue=manifest.parts.filter(x=>x.status==='no_duplicate_detected').flatMap(x=>JSON.parse(fs.readFileSync(base+'/'+x.file)));assert.equal(queue.length,493);
          const selected=queue.slice((batch-1)*50,batch*50);assert.equal(selected.length,batch===10?43:50);
          let cacheDir=null;const pointer='audit-source/reports/uffizi-batch-review-'+batch+'.json';if(fs.existsSync(pointer)){const p=JSON.parse(fs.readFileSync(pointer));assert(/^reports\/uffizi-batch-reviews\/[0-9]+-[0-9]+$/.test(p.destination));if(p.batch===batch&&p.complete)cacheDir='audit-source/'+p.destination;}
          const out='reports/uffizi-batch-review';fs.mkdirSync(out,{recursive:true});
          const summary={assessmentVersion:2,batch,expected:selected.length,processed:0,counts:{metadata_consistent_pending_museum_and_visual:0,needs_identity_review:0,incomplete:0},reusedDecodedImages:0,downloadedImages:0,editorialNotesCount:0,qualityNotesCount:0,missingMuseumLinks:0,entries:[],complete:false,gameFilesModified:false,visualReviewPerformed:false,catalogueSnapshot:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),previousEvidence:cacheDir};
          const save=()=>fs.writeFileSync(out+'/summary.json',JSON.stringify(summary,null,2));save();
          const entities={};
          async function load(ids){const missing=[...new Set(ids)].filter(id=>/^Q\d+$/.test(id)&&!entities[id]);for(let i=0;i<missing.length;i+=25){const ids=missing.slice(i,i+25);let error;for(let n=0;n<3;n++){try{const r=await fetch('https://www.wikidata.org/w/api.php?'+new URLSearchParams({action:'wbgetentities',format:'json',ids:ids.join('|'),props:'labels|aliases|claims'}),{redirect:'error',signal:AbortSignal.timeout(25000),headers:{'User-Agent':'PaintingUffiziBatchReview/2.0 (https://github.com/kameralog/kameralog.github.io)'}});assert(r.ok,'Wikidata HTTP '+r.status);const j=await r.json();assert(j.entities&&!j.error);Object.assign(entities,j.entities);error=null;break;}catch(e){error=e;await new Promise(r=>setTimeout(r,2000*(n+1)));}}if(error)for(const id of ids)entities[id]={fetchError:error.message};}}
          await load([PAINTING,...selected.map(x=>x.work)]);assert.equal(entities[PAINTING]?.labels?.en?.value,'painting','Painting reference entity failed validation');
          await load(selected.flatMap(x=>values(entities[x.work],'P170').map(v=>v?.id).filter(Boolean)));
          const net=new Network({maxRequests:350,seconds:1200,interval:1500});
          for(const item of selected){const c=JSON.parse(fs.readFileSync(pkg+'/'+item.file)),e=entities[c.work],identityIssues=[],editorialNotes=[],qualityNotes=[],technicalErrors=[],checks={};let image=null,reused=false;
          if(!e||e.fetchError||e.missing!==undefined)technicalErrors.push(e?.fetchError||'Wikidata entity unavailable');
          else{checks.painting=isPainting(e);if(!checks.painting)identityIssues.push('Painting or painting subtype not established; do not infer that the work is not a painting');checks.currentCollection=values(e,'P195').some(v=>c.collections.includes(v?.id));if(!checks.currentCollection)identityIssues.push('Collection changed or not confirmed');const creators=active(e,'P170');checks.singleUnqualifiedCreator=creators.length===1&&Object.keys(creators[0].qualifiers||{}).every(p=>p==='P1932');if(!checks.singleUnqualifiedCreator)identityIssues.push('Attribution requires review');const creator=entities[creators[0]?.mainsnak?.datavalue?.value?.id];const cn=[...Object.values(creator?.labels||{}),...Object.values(creator?.aliases||{}).flat()].map(x=>norm(x.value));checks.creatorNameMatches=[c.artist,c.chosenImage?.rights?.author].filter(Boolean).some(n=>cn.includes(norm(n)));if(!checks.creatorNameMatches)identityIssues.push('Creator name not independently matched in current entity labels');checks.fileIsRecordedImage=active(e,'P18').some(x=>!x.qualifiers?.P518&&file(x.mainsnak?.datavalue?.value)===file(c.chosenImage?.file));if(!checks.fileIsRecordedImage)identityIssues.push('Chosen file is not a current unspecialized image claim');checks.inventoryConsistent=values(e,'P217').some(v=>c.inventories.includes(v));if(!checks.inventoryConsistent)identityIssues.push('Inventory missing or changed');}
          const titles={ru:e?.labels?.ru?.value||'',en:e?.labels?.en?.value||'',it:e?.labels?.it?.value||''},title=titles.ru||titles.en||titles.it||c.title;if(/^Q\d+$/.test(title))editorialNotes.push('Human-readable title missing');if(!titles.ru)editorialNotes.push('Russian title needs editorial preparation');
          const objectLinks=values(e,'P973').filter(x=>typeof x==='string'&&/^https:\/\/(?:www\.)?uffizi\.it\/(?:en\/|it\/)?artworks\//i.test(x));checks.officialObjectLinkRecorded=objectLinks.length>0;if(!objectLinks.length)summary.missingMuseumLinks++;
          if(/\b(detail|fragment|verso|reverse|cropped|dettaglio|particolare)\b/i.test(file(c.chosenImage?.file)))identityIssues.push('File name suggests detail, crop or reverse');
          if(cacheDir&&fs.existsSync(cacheDir+'/'+item.file)){const old=JSON.parse(fs.readFileSync(cacheDir+'/'+item.file));if(old.work===c.work&&old.artistId===c.artistId&&old.checks?.imageDecoded===true&&old.image?.rights&&file(old.image.file)===file(c.chosenImage?.file)){image=old.image;reused=true;summary.reusedDecodedImages++;}}
          if(!image)try{assert(c.chosenImage?.file,'No selected image');const j=await net.json('https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',formatversion:2,titles:'File:'+c.chosenImage.file,prop:'imageinfo',iiprop:'url|size|extmetadata'}));const ii=j.query?.pages?.[0]?.imageinfo?.[0];assert(ii?.url,'Commons image unavailable');const rights=commonsRights(ii.extmetadata||{});const response=await net.request(ii.url);const bytes=await net.bytes(response,64*1024*1024);const meta=await sharp(bytes,{limitInputPixels:80000000}).metadata();await sharp(bytes,{limitInputPixels:80000000}).rotate().resize(32,32,{fit:'inside'}).raw().toBuffer();image={file:c.chosenImage.file,url:ii.url,source:ii.descriptionurl,width:meta.width,height:meta.height,format:meta.format,rights};summary.downloadedImages++;}catch(err){technicalErrors.push(err.message);}
          checks.imageDecoded=!!image;checks.openRights=image?.rights?.status==='documented_open';if(image&&!checks.openRights)identityIssues.push('Rights require review');if(image&&Math.min(image.width||0,image.height||0)<600)qualityNotes.push('Short side below 600 pixels; quality warning, not identity rejection');
          const status=technicalErrors.length?'incomplete':identityIssues.length?'needs_identity_review':'metadata_consistent_pending_museum_and_visual';const result={assessmentVersion:2,batch,artistId:c.artistId,artist:c.artist,work:c.work,title,titles,status,identityIssues,editorialNotes,qualityNotes,technicalErrors,checks,objectLinks,museumVerification:'not_performed',image,imageEvidence:reused?'reused_from_saved_decode_and_rights_check':'downloaded_and_decoded_this_run',previousEvidence:reused?cacheDir:null,inventory:c.inventories,visualReviewPerformed:false,applyAllowed:false};fs.writeFileSync(out+'/'+item.file,JSON.stringify(result,null,2));summary.entries.push({artist:c.artist,work:c.work,title,status,identityIssues,editorialNotes,qualityNotes,technicalErrors,file:item.file});summary.counts[status]++;summary.editorialNotesCount+=editorialNotes.length;summary.qualityNotesCount+=qualityNotes.length;summary.processed++;save();}
          assert.equal(summary.processed,summary.expected);assert.equal(summary.reusedDecodedImages+summary.downloadedImages+summary.counts.incomplete,summary.expected);const all=summary.entries;delete summary.entries;summary.parts=[];let chunk=[],n=1;const flush=()=>{if(!chunk.length)return;const f='results-'+String(n++).padStart(3,'0')+'.json';fs.writeFileSync(out+'/'+f,JSON.stringify(chunk));summary.parts.push({file:f,count:chunk.length});chunk=[];};for(const row of all){if(Buffer.byteLength(JSON.stringify([...chunk,row]))>8000)flush();chunk.push(row);}flush();summary.complete=true;summary.note='Corrected metadata assessment. Editorial and quality notes are separate. Museum links, even when recorded, have not been independently checked; no visual approval or installation. Reused rights and decoding evidence retains the previous run scope, not a new download claim.';save();
          NODE
      - name: Confirm game unchanged
        if: always()
        run: git diff --exit-code -- games/painting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uffizi-batch-${{ inputs.batch || 1 }}-${{ github.run_id }}
          path: reports/uffizi-batch-review/
          if-no-files-found: warn
      - name: Save batch review separately
        if: always() && hashFiles('reports/uffizi-batch-review/summary.json') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uffizi-batch-output"
          cp reports/uffizi-batch-review/*.json "$RUNNER_TEMP/uffizi-batch-output/"
          rm -rf reports/uffizi-batch-review audit-source
          git fetch origin refs/heads/museum-reports:refs/remotes/origin/museum-reports
          git checkout -B museum-reports origin/museum-reports
          destination="reports/uffizi-batch-reviews/$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/uffizi-batch-output/"*.json "$destination/"
          DESTINATION="$destination" python3 <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ['DESTINATION']);s=json.loads((p/'summary.json').read_text())
          pointer={'destination':str(p),'batch':s['batch'],'processed':s['processed'],'complete':s['complete'],'counts':s['counts'],'assessmentVersion':s['assessmentVersion']}
          pathlib.Path('reports/uffizi-batch-review-latest.json').write_text(json.dumps(pointer,indent=2))
          pathlib.Path('reports/uffizi-batch-review-'+str(s['batch'])+'.json').write_text(json.dumps(pointer,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination" reports/uffizi-batch-review-*.json
          git commit -m "Reassess Uffizi candidate batch $RUN_ID"
          git push origin HEAD:refs/heads/museum-reports
