name: Apply 34 catalogue reproductions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/apply-audit-bindings.mjs'
      - '.github/workflows/apply-audit-bindings.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kameralog/painting-audit-data
          ref: fb485e38be5e745879b4ad6fb16ecc941edea64e
          path: audit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded bindings and rebuild catalogue
        shell: bash
        run: |
          set -euo pipefail
          node tools/apply-audit-bindings.mjs --test
          node tools/apply-audit-bindings.mjs audit
          (
            cd games/painting
            node install-reviewed-reproductions.mjs --test
            node install-reviewed-reproductions.mjs
            node install-package-reproductions.mjs --test
            node install-package-reproductions.mjs
            node build-artists.mjs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- games/painting/artists-batch-*.js games/painting/artists.js games/painting/index.html reports/painting-bindings-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Bind 34 catalogue reproductions; preserve quiz and existing works"
            git push origin HEAD:main
          fi
          echo "EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish and verify Pages catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          gh api "$endpoint" > "$RUNNER_TEMP/painting-pages.json"
          test "$(jq -r '.build_type' "$RUNNER_TEMP/painting-pages.json")" = legacy
          test "$(jq -r '.source.branch' "$RUNNER_TEMP/painting-pages.json")" = main
          test "$(jq -r '.source.path' "$RUNNER_TEMP/painting-pages.json")" = /
          requested=false
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "$endpoint/builds" > "$RUNNER_TEMP/painting-pages-request.json"; then
              requested=true
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "$requested" = true
          base=$(jq -r '.html_url' "$RUNNER_TEMP/painting-pages.json")
          case "$base" in https://*) ;; *) exit 1;; esac
          for attempt in $(seq 1 60); do
            gh api "$endpoint/builds/latest" > "$RUNNER_TEMP/painting-pages-status.json"
            status=$(jq -r '.status' "$RUNNER_TEMP/painting-pages-status.json")
            commit=$(jq -r '.commit' "$RUNNER_TEMP/painting-pages-status.json")
            if [ "$status" = errored ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then exit 1; fi
            if [ "$status" = built ] && [ "$commit" = "$EXPECTED_COMMIT" ] && curl --fail --silent --show-error --location --max-time 30 "${base%/}/games/painting/artists.js?v=$EXPECTED_COMMIT" -o "$RUNNER_TEMP/live-artists.js" && cmp -s games/painting/artists.js "$RUNNER_TEMP/live-artists.js"; then
              echo "Published catalogue matches $EXPECTED_COMMIT; 34 bindings installed."
              exit 0
            fi
            sleep 10
          done
          echo "Catalogue committed, but Pages publication was not verified." >&2
          exit 1
