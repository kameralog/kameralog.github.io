name: Publish reviewed third wiki batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-uffizi-batch3.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 48 reviewed reproductions and preserve previous batches
