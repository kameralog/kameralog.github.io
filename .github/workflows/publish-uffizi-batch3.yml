      - name: Commit bindings and report and request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/painting/artists-batch-{2,7,17,18,19,38,52,96}.js games/painting/artists.js games/painting/reports/wiki-batches/batch-003.json
          git diff --cached --stat
          git commit -m 'Connect 48 third-batch reproductions and record one deferred work and one duplicate'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify live catalogue and record verification
        working-directory: games/painting
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --compressed --location --connect-timeout 5 --max-time 20 "https://kameralog.github.io/games/painting/artists.js?wiki-batch3=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/wiki-batch3-live.js" && cmp -s artists.js "$RUNNER_TEMP/wiki-batch3-live.js"; then
              node --input-type=module -e 'import fs from "node:fs";const p="reports/wiki-batches/batch-003.json";const r=JSON.parse(fs.readFileSync(p,"utf8"));r.status="published_catalogue_verified_rendered_pages_pending";r.liveArtistsJsMatchesMain=true;r.livePublishedRecords=48;r.remainingChecks=["rendered_artist_pages"];for(const x of r.reviewResults)if(x.status==="connected_pending_site_verification")x.status="published_catalogue_verified";fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n");'
              git add reports/wiki-batches/batch-003.json
              git commit -m 'Record live catalogue verification for wiki batch three'
              git pull --rebase origin main
              git push origin HEAD:main
              echo 'Verified live catalogue: 48 reproductions, 9 artist pages. Full visual and individual page checks remain unclaimed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Bindings committed; publication verification pending. Do not claim live verification.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
