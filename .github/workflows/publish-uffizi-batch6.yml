name: Publish reviewed sixth wiki batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-uffizi-batch6.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
