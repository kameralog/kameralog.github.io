name: Resolve remaining 100 museum records
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/apply-museum-wikidata-v3.mjs'
      - '.github/workflows/apply-museum-wikidata-v3.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kameralog/painting-audit-data
          ref: fb485e38be5e745879b4ad6fb16ecc941edea64e
          path: audit
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image decoder
        run: npm install --no-save --package-lock=false sharp@0.33.5
      - name: Repair VM context, verify, bind and rebuild
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          import {Buffer} from 'node:buffer';
          import {createHash} from 'node:crypto';
          const file='tools/apply-museum-wikidata-v3.mjs';
          let source=fs.readFileSync(file,'utf8');
          const before='const box={fs,assert,createHash,console};';
          const after='const box={fs,assert,createHash,console,Buffer};';
          assert.equal(vm.runInNewContext("Buffer.byteLength('Я')",{Buffer}),2);
          if(source.includes(after)){
            assert(!source.includes(before),'Conflicting context definitions');
            console.log('Buffer context already repaired');
          }else{
            const blob=createHash('sha1').update('blob '+Buffer.byteLength(source)+String.fromCharCode(0)).update(source).digest('hex');
            assert.equal(blob,'7d5e7a85fdba8667eadc5b2ad0dc6636fb89f171','Processor changed; stop rather than overwrite');
            assert.equal(source.split(before).length,2,'Expected one VM context');
            source=source.replace(before,()=>after);
            fs.writeFileSync(file,source);
            console.log('Passed Buffer explicitly to the preparation VM');
          }
          NODE
          node --check tools/apply-museum-wikidata-v3.mjs
          node tools/apply-museum-wikidata-v3.mjs --test
          node tools/apply-museum-wikidata-v3.mjs audit
          (
            cd games/painting
            node install-reviewed-reproductions.mjs --test
            node install-reviewed-reproductions.mjs
            node install-package-reproductions.mjs --test
            node install-package-reproductions.mjs
            node build-artists.mjs
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/apply-museum-wikidata-v3.mjs games/painting/artists-batch-*.js games/painting/artists.js games/painting/index.html reports/painting-museum-wikidata-v3
          if ! git diff --cached --quiet; then
            git commit -m "Fix Buffer preparation context and bind verified museum records"
            git push origin HEAD:main
          fi
          echo "EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BINDINGS_ADDED=$(jq -r '.bound' reports/painting-museum-wikidata-v3/summary.json)" >> "$GITHUB_ENV"
      - name: Publish and verify catalogue
        if: env.BINDINGS_ADDED != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          gh api "$endpoint" > "$RUNNER_TEMP/pages.json"
          test "$(jq -r '.build_type' "$RUNNER_TEMP/pages.json")" = legacy
          test "$(jq -r '.source.branch' "$RUNNER_TEMP/pages.json")" = main
          test "$(jq -r '.source.path' "$RUNNER_TEMP/pages.json")" = /
          requested=false
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "$endpoint/builds"; then requested=true; break; fi
            sleep "$((attempt * 5))"
          done
          test "$requested" = true
          base=$(jq -r '.html_url' "$RUNNER_TEMP/pages.json")
          case "$base" in https://*) ;; *) exit 1;; esac
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --location --max-time 30 "${base%/}/games/painting/artists.js?v=$EXPECTED_COMMIT" -o "$RUNNER_TEMP/live-artists.js" && cmp -s games/painting/artists.js "$RUNNER_TEMP/live-artists.js"; then
              echo "Published catalogue verified; added $BINDINGS_ADDED reproductions."
              exit 0
            fi
            sleep 10
          done
          echo "Changes committed, but publication not verified." >&2
          exit 1
