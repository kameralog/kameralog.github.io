name: Audit painting research coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-painting-research-coverage.yml'
      - 'tools/audit-painting-research-coverage.py'
      - 'editorial/painting/manifest.json'
      - 'editorial/painting/index-*.json'
      - 'editorial/painting/summary.json'
      - 'editorial/painting/research/*.json'
permissions:
  contents: write
concurrency:
  group: painting-research-coverage
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all packages and build coverage report
        run: python tools/audit-painting-research-coverage.py --write
      - name: Commit only the coverage report
        shell: bash
        run: |
          set -euo pipefail
          git add -- reports/painting-research-coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update painting research coverage report"
          git push origin HEAD:main
