name: Publish reviewed tenth wiki batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-uffizi-batch10.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
jobs:
