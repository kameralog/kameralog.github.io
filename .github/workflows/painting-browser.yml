name: Painting browser verification
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository JSON inside tools/painting-browser
        default: tools/painting-browser/targets.json
        required: true
        type: string
      limit:
        description: Maximum selected works (1..50)
        default: '10'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/painting-browser.yml'
      - 'tools/painting-browser/**'
permissions:
  contents: read
concurrency:
  group: painting-browser-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_MANIFEST: ${{ inputs.manifest || 'tools/painting-browser/targets.json' }}
      INPUT_LIMIT: ${{ inputs.limit || '50' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select changed manifest for push runs
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const before=process.env.PUSH_BEFORE;
          if(!/^[0-9a-f]{40}$/.test(before||'')||/^0+$/.test(before))throw Error('Cannot determine push base; dispatch with an explicit manifest');
          const changed=execFileSync('git',['diff','--name-only','-z','--diff-filter=AM',before,process.env.GITHUB_SHA],{encoding:'utf8'}).split('\0');
          const manifests=changed.filter(p=>p.startsWith('tools/painting-browser/')&&p.endsWith('.json')&&!['package.json','package-lock.json'].includes(p.split('/').at(-1)));
          if(manifests.length>1)throw Error('Multiple changed manifests; dispatch with an explicit manifest');
          if(manifests.length===1){
            if(/[\r\n]/.test(manifests[0]))throw Error('Unsafe manifest path');
            fs.appendFileSync(process.env.GITHUB_ENV,'INPUT_MANIFEST='+manifests[0]+'\n');
            console.log('Selected push manifest: '+manifests[0]);
          }
          NODE
      - name: Validate verifier and prepare pending report
        run: |
          export REPORT_DIR="$RUNNER_TEMP/painting-browser-output"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
          node --check tools/painting-browser/verify.mjs
          node tools/painting-browser/verify.mjs --self-test
          node tools/painting-browser/verify.mjs --prepare
      - name: Install pinned Playwright
        working-directory: tools/painting-browser
        run: npm install --no-save --ignore-scripts --omit=optional --no-audit --no-fund --package-lock=false
      - name: Install Chromium and system dependencies
        working-directory: tools/painting-browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check selected images in Chromium
        run: node tools/painting-browser/verify.mjs
      - name: Confirm application files are unchanged
        if: always()
        run: git diff --exit-code -- games/painting editorial/painting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: painting-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/painting-browser-output/
          retention-days: 7
          if-no-files-found: warn
  save-report:
    needs: verify
    if: ${{ always() && needs.verify.result != 'cancelled' && github.repository == 'kameralog/kameralog.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: painting-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-output
      - name: Save report and readable per-run evidence to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const raw=fs.readFileSync('browser-output/report.json');
          if(raw.length>5000000)throw Error('Report too large');
          const data=JSON.parse(raw);
          if(data.sourceCommit!==process.env.GITHUB_SHA||data.runId!==process.env.GITHUB_RUN_ID)throw Error('Wrong report snapshot');
          const endpoint='https://api.github.com/repos/kameralog/kameralog.github.io/contents/reports/painting-browser/latest.json';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          let saved=false,reportCommit;
          for(let attempt=0;attempt<3;attempt++){
            const current=await fetch(endpoint+'?ref=main',{headers});
            if(!current.ok&&current.status!==404)throw Error('Read report: '+current.status);
            const sha=current.ok?(await current.json()).sha:undefined;
            const response=await fetch(endpoint,{method:'PUT',headers,body:JSON.stringify({branch:'main',message:'Record painting browser verification (run '+process.env.GITHUB_RUN_ID+')',content:raw.toString('base64'),...(sha?{sha}:{})})});
            if(response.ok){reportCommit=(await response.json()).commit.sha;saved=true;break;}
            if(![409,422].includes(response.status))throw Error('Save report: '+response.status+' '+await response.text());
            await new Promise(r=>setTimeout(r,1000));
          }
          if(!saved)throw Error('Report save retries exhausted');
          const prefix='reports/painting-browser/runs/'+data.runId+'-'+process.env.GITHUB_RUN_ATTEMPT;
          const reportBlob=createHash('sha1').update('blob '+raw.length+'\0').update(raw).digest('hex');
          const proof={sourceReportCommit:reportCommit,sourceReportBlob:reportBlob,browserRunId:data.runId,sourceCommit:data.sourceCommit};
          const outputs=data.rows.map((row,i)=>{
            const ext=Object.fromEntries(Object.entries(row.metadata?.extmetadata||{}).filter(([k])=>!['ObjectName','Categories','DateTime','Assessments','CommonsMetadataExtension'].includes(k)));
            const content=JSON.stringify({...proof,...row,metadata:row.metadata?{...row.metadata,extmetadata:ext}:null},null,2)+'\n';
            if(Buffer.byteLength(content)>28000)throw Error('Row exceeds readable archive size: '+row.id);
            return {path:prefix+'/row-'+String(i).padStart(3,'0')+'.json',mode:'100644',type:'blob',content};
          });
          const summary={schemaVersion:1,status:'derived_evidence_not_editorially_approved',...proof,manifest:data.manifest,manifestSha256:data.manifestSha256,selectionComplete:data.selectionComplete,browserStatus:data.status,browserSmokePassed:data.browserSmokePassed,counts:data.counts,errors:data.errors,identityReviewed:false,rightsReviewed:false,imageVisuallyReviewed:false,rows:data.rows.map((r,i)=>({id:r.id,status:r.status,pageid:r.metadata?.pageid||null,path:outputs[i].path}))};
          outputs.push({path:prefix+'/summary.json',mode:'100644',type:'blob',content:JSON.stringify(summary,null,2)+'\n'});
          const base='https://api.github.com/repos/kameralog/kameralog.github.io';
          const api=async(method,url,body)=>{const r=await fetch(base+url,{method,headers,...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(method+' '+url+': '+r.status+' '+await r.text());return r.json();};
          let archived=false;
          for(let attempt=0;attempt<3;attempt++){
            const ref=await api('GET','/git/ref/heads/main');
            const head=ref.object.sha;
            const parent=await api('GET','/git/commits/'+head);
            const tree=await api('POST','/git/trees',{base_tree:parent.tree.sha,tree:outputs});
            const commit=await api('POST','/git/commits',{message:'Archive readable painting browser evidence (run '+data.runId+')',tree:tree.sha,parents:[head]});
            const response=await fetch(base+'/git/refs/heads/main',{method:'PATCH',headers,body:JSON.stringify({sha:commit.sha,force:false})});
            if(response.ok){archived=true;break;}
            if(![409,422].includes(response.status))throw Error('Archive ref update: '+response.status+' '+await response.text());
            await new Promise(r=>setTimeout(r,1000));
          }
          if(!archived)throw Error('Archive save retries exhausted');
          NODE
