name: Audit all site artists in Uffizi index
on:
  push:
    branches: [main]
    paths: ['tools/audit-uffizi-all.mjs', '.github/workflows/audit-uffizi-all.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-museum-reports
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline checks
        run: |
          set -euo pipefail
          node --check tools/audit-uffizi-all.mjs
          node tools/audit-uffizi-all.mjs --test
          node games/painting/test-discover-painting-images.mjs
      - name: Check every current site artist
        run: node tools/audit-uffizi-all.mjs
      - name: Confirm catalogue unchanged
        if: always()
        run: git diff --exit-code -- games/painting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uffizi-all-${{ github.run_id }}
          path: reports/uffizi-all/
          if-no-files-found: warn
          retention-days: 30
      - name: Save complete or partial report on isolated branch
        if: always() && hashFiles('reports/uffizi-all/summary.json') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uffizi-all-safe"
          cp reports/uffizi-all/*.json "$RUNNER_TEMP/uffizi-all-safe/"
          rm -rf reports/uffizi-all
          if git ls-remote --exit-code --heads origin refs/heads/museum-reports; then
            git fetch origin refs/heads/museum-reports:refs/remotes/origin/museum-reports
            git checkout -B museum-reports origin/museum-reports
          else
            git checkout --orphan museum-reports
            git rm -rf --ignore-unmatch .
          fi
          destination="reports/uffizi-all-runs/$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/uffizi-all-safe/"*.json "$destination/"
          DESTINATION="$destination" python3 <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['DESTINATION'])
          s=json.loads((p/'summary.json').read_text())
          pointer={'runId':os.environ['RUN_ID'],'destination':str(p),'complete':s.get('complete',False),'artistsProcessed':s.get('artistsProcessed',0),'artistsTotal':s.get('artistsTotal',0)}
          pathlib.Path('reports/uffizi-all-latest.json').write_text(json.dumps(pointer,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination" reports/uffizi-all-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Save full-site Uffizi index audit $RUN_ID"
            git push origin HEAD:refs/heads/museum-reports
          fi
