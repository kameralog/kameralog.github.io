name: Audit all site artists in Uffizi index
on:
  push:
    branches: [main]
    paths: ['tools/audit-uffizi-all.mjs', '.github/workflows/audit-uffizi-all.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-museum-reports
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair invalid query escapes with version guard
        run: |
          python3 <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('tools/audit-uffizi-all.mjs')
          s=p.read_text()
          old=r'\\.'
          if old in s:
              blob=hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()
              assert blob=='3d5e71ebd458a717c17bccb00f5150495b6f5281','Audit changed; refusing to overwrite'
              assert s.count(old)==2,'Unexpected escaped-dot count'
              s=s.replace(old,'[.]')
              anchor="assert(r.ok,'HTTP '+r.status);"
              assert s.count(anchor)==1
              s=s.replace(anchor,"if(!r.ok)throw Error('HTTP '+r.status+': '+(await r.text()).slice(0,1500));")
              p.write_text(s)
          else:
              assert '(www[.])?uffizi[.]it' in s,'Unexpected audit query'
          PY
      - name: Install query syntax validator outside repository
        run: npm install --prefix "$RUNNER_TEMP/sparql-check" --no-save --package-lock=false sparqljs@3
      - name: Validate actual generated query and domain filter
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          const {Parser}=require(process.env.RUNNER_TEMP+'/sparql-check/node_modules/sparqljs');
          const source=fs.readFileSync('tools/audit-uffizi-all.mjs','utf8');
          const lines=source.split('\n').filter(l=>l.includes('const query=`'));
          assert.equal(lines.length,1);
          const box={offset:0};
          vm.runInNewContext(lines[0].replace('const query=','globalThis.query='),box,{timeout:1000});
          const prefixes={p:'http://www.wikidata.org/prop/',ps:'http://www.wikidata.org/prop/statement/',pq:'http://www.wikidata.org/prop/qualifier/',wdt:'http://www.wikidata.org/prop/direct/',wikibase:'http://wikiba.se/ontology#'};
          assert.equal(new Parser({prefixes}).parse(box.query).queryType,'SELECT');
          const pattern=box.query.match(/REGEX\(STR\(\?site\),"([^"]+)"/)[1];
          const re=new RegExp(pattern,'i');
          assert(re.test('https://www.uffizi.it/'));
          assert(re.test('https://uffizi.it/en'));
          assert(!re.test('https://www.uffizi.it.evil.invalid/'));
          assert(!re.test('https://not-uffizi.it/'));
          console.log('Generated SPARQL query parses; official domain filter passed');
          NODE
      - name: Offline checks
        run: |
          set -euo pipefail
          node --check tools/audit-uffizi-all.mjs
          node tools/audit-uffizi-all.mjs --test
          node games/painting/test-discover-painting-images.mjs
      - name: Save tested query repair only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/audit-uffizi-all.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Fix SPARQL string escapes and preserve server error details'
            git push origin HEAD:main
          fi
      - name: Check every current site artist
        run: node tools/audit-uffizi-all.mjs
      - name: Confirm catalogue unchanged
        if: always()
        run: git diff --exit-code -- games/painting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uffizi-all-${{ github.run_id }}
          path: reports/uffizi-all/
          if-no-files-found: warn
          retention-days: 30
      - name: Save complete or partial report on isolated branch
        if: always() && hashFiles('reports/uffizi-all/summary.json') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uffizi-all-safe"
          cp reports/uffizi-all/*.json "$RUNNER_TEMP/uffizi-all-safe/"
          rm -rf reports/uffizi-all
          if git ls-remote --exit-code --heads origin refs/heads/museum-reports; then
            git fetch origin refs/heads/museum-reports:refs/remotes/origin/museum-reports
            git checkout -B museum-reports origin/museum-reports
          else
            git checkout --orphan museum-reports
            git rm -rf --ignore-unmatch .
          fi
          destination="reports/uffizi-all-runs/$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/uffizi-all-safe/"*.json "$destination/"
          DESTINATION="$destination" python3 <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['DESTINATION'])
          s=json.loads((p/'summary.json').read_text())
          pointer={'runId':os.environ['RUN_ID'],'destination':str(p),'complete':s.get('complete',False),'artistsProcessed':s.get('artistsProcessed',0),'artistsTotal':s.get('artistsTotal',0)}
          pathlib.Path('reports/uffizi-all-latest.json').write_text(json.dumps(pointer,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination" reports/uffizi-all-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Save full-site Uffizi index audit $RUN_ID"
            git push origin HEAD:refs/heads/museum-reports
          fi
