name: Audit all site artists in Uffizi index
on:
  push:
    branches: [main]
    paths: ['tools/audit-uffizi-all.mjs', '.github/workflows/audit-uffizi-all.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: save-museum-reports
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace graph-wide query with explicit collection lookup
        run: |
          python3 <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('tools/audit-uffizi-all.mjs')
          s=p.read_text()
          if 'VALUES ?collection { wd:Q51252 wd:Q16335227 wd:Q866498 }' not in s:
              blob=hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()
              assert blob=='0185ee4421750784fcf813fe2aaab994dd0f2159','Audit changed; refusing to overwrite'
              lines=s.splitlines()
              targets=[i for i,l in enumerate(lines) if 'const query=`' in l]
              assert len(targets)==1
              lines[targets[0]]='  const query=`SELECT DISTINCT ?work ?creator ?collection WHERE { VALUES ?collection { wd:Q51252 wd:Q16335227 wd:Q866498 } ?work p:P195 ?cs. ?cs ps:P195 ?collection. FILTER NOT EXISTS {?cs pq:P582 ?end} FILTER NOT EXISTS {?cs wikibase:rank wikibase:DeprecatedRank} ?work p:P170 ?as. ?as ps:P170 ?creator. FILTER NOT EXISTS {?as wikibase:rank wikibase:DeprecatedRank} } ORDER BY ?work ?creator ?collection LIMIT 200 OFFSET ${offset}`;'
              s='\n'.join(lines)+'\n'
              assert s.count('rows.length<400')==1
              s=s.replace('rows.length<400','rows.length<200')
              assert s.count('page<50')==1
              s=s.replace('page<50','page<100')
              old='Wikidata current collection claims linked through collection/parent official websites to uffizi.it; not a complete museum catalogue or visual review'
              assert s.count(old)==1
              s=s.replace(old,'All current site artists checked against Wikidata collections Q51252, Q16335227 (Uffizi) and Q866498 (Galleria Palatina); not a complete museum catalogue or visual review')
              p.write_text(s)
          PY
      - name: Install query validator outside repository
        run: npm install --prefix "$RUNNER_TEMP/sparql-check" --no-save --package-lock=false sparqljs@3
      - name: Validate query and test a real one-record response
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {Parser}=createRequire(import.meta.url)(process.env.RUNNER_TEMP+'/sparql-check/node_modules/sparqljs');
          const lines=fs.readFileSync('tools/audit-uffizi-all.mjs','utf8').split('\n').filter(l=>l.includes('const query=`'));assert.equal(lines.length,1);
          const box={offset:0};vm.runInNewContext(lines[0].replace('const query=','globalThis.query='),box,{timeout:1000});
          const prefixes={wd:'http://www.wikidata.org/entity/',p:'http://www.wikidata.org/prop/',ps:'http://www.wikidata.org/prop/statement/',pq:'http://www.wikidata.org/prop/qualifier/',wikibase:'http://wikiba.se/ontology#'};
          assert.equal(new Parser({prefixes}).parse(box.query).queryType,'SELECT');
          assert(box.query.includes('VALUES ?collection { wd:Q51252 wd:Q16335227 wd:Q866498 }'));
          assert(!box.query.includes('P361'));assert(!box.query.includes('REGEX'));
          const query=box.query.replace('LIMIT 200','LIMIT 1');
          const r=await fetch('https://query.wikidata.org/sparql?'+new URLSearchParams({query,format:'json'}),{redirect:'error',signal:AbortSignal.timeout(60000),headers:{Accept:'application/sparql-results+json','User-Agent':'PaintingUffiziAudit/1.0 (https://github.com/kameralog/kameralog.github.io)'}});
          if(!r.ok)throw Error('Smoke test HTTP '+r.status+': '+(await r.text()).slice(0,1500));
          const j=await r.json();assert(j.results?.bindings?.length===1,'No museum work returned; stop before full audit');
          console.log('SPARQL parses and remote one-record test passed');
          NODE
      - name: Offline checks
        run: |
          set -euo pipefail
          node --check tools/audit-uffizi-all.mjs
          node tools/audit-uffizi-all.mjs --test
          node games/painting/test-discover-painting-images.mjs
      - name: Save tested query repair only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/audit-uffizi-all.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Limit Uffizi audit to explicit collection IDs and bounded pages'
            git push origin HEAD:main
          fi
      - name: Check every current site artist
        run: node tools/audit-uffizi-all.mjs
      - name: Confirm catalogue unchanged
        if: always()
        run: git diff --exit-code -- games/painting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uffizi-all-${{ github.run_id }}
          path: reports/uffizi-all/
          if-no-files-found: warn
          retention-days: 30
      - name: Save complete or partial report on isolated branch
        if: always() && hashFiles('reports/uffizi-all/summary.json') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uffizi-all-safe"
          cp reports/uffizi-all/*.json "$RUNNER_TEMP/uffizi-all-safe/"
          rm -rf reports/uffizi-all
          if git ls-remote --exit-code --heads origin refs/heads/museum-reports; then
            git fetch origin refs/heads/museum-reports:refs/remotes/origin/museum-reports
            git checkout -B museum-reports origin/museum-reports
          else
            git checkout --orphan museum-reports
            git rm -rf --ignore-unmatch .
          fi
          destination="reports/uffizi-all-runs/$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/uffizi-all-safe/"*.json "$destination/"
          DESTINATION="$destination" python3 <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['DESTINATION'])
          s=json.loads((p/'summary.json').read_text())
          pointer={'runId':os.environ['RUN_ID'],'destination':str(p),'complete':s.get('complete',False),'artistsProcessed':s.get('artistsProcessed',0),'artistsTotal':s.get('artistsTotal',0)}
          pathlib.Path('reports/uffizi-all-latest.json').write_text(json.dumps(pointer,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination" reports/uffizi-all-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Save full-site Uffizi index audit $RUN_ID"
            git push origin HEAD:refs/heads/museum-reports
          fi
