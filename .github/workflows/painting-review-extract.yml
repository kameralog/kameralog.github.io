name: Extract painting browser report for batch 159
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/painting-review-extract.yml'
      - 'tools/extract-painting-browser-report.mjs'
permissions:
  contents: write
concurrency:
  group: painting-review-extract-159
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract archived results and audit current catalogue
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          saved=false
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check tools/extract-painting-browser-report.mjs
            node tools/extract-painting-browser-report.mjs --self-test
            node tools/extract-painting-browser-report.mjs
            git diff --exit-code -- games/painting editorial/painting tools .github
            git add reports/painting-browser/159
            if git diff --cached --quiet; then saved=true; break; fi
            git commit -m 'Extract archived Playwright evidence and catalogue audit for batch 159'
            if git push origin HEAD:main; then saved=true; break; fi
            sleep "$((attempt * 2))"
          done
          test "$saved" = true
          echo 'Derived evidence saved. No artist cards changed; identity, rights and visual review remain unapproved.' >> "$GITHUB_STEP_SUMMARY"
