              node --input-type=module -e 'import fs from "node:fs";const p="reports/wiki-batches/batch-005.json";const r=JSON.parse(fs.readFileSync(p,"utf8"));r.status="published_catalogue_verified_rendered_pages_pending";r.liveArtistsJsMatchesMain=true;r.livePublishedRecords=45;r.remainingChecks=["rendered_artist_pages"];for(const x of r.reviewResults)if(x.status==="connected_pending_site_verification")x.status="published_catalogue_verified";fs.writeFileSync(p,JSON.stringify(r,null,2)+"\n");'
              git add reports/wiki-batches/batch-005.json
              git commit -m 'Record live catalogue verification for wiki batch five'
              git pull --rebase origin main
              git push origin HEAD:main
              echo 'Verified live catalogue: 45 new bindings, one already present, four deferred. Individual page and full visual reviews remain unclaimed.' >> "$GITHUB_STEP_SUMMARY"
