          const report={schemaVersion:1,batch:5,batchSize:50,range:[201,250],checkedDate:'2026-11-15',status:'connected_publication_pending',total:50,foundReproductions:50,browserImagesDecoded:50,ruOrEnWikipediaArticlesFound:22,newlyConnected:45,alreadyPresentCount:1,alreadyPresent:[235],duplicatesCount:0,deferredConfirmed:4,artistPages:21,sourceFiles:14,liveArtistsJsMatchesMain:false,renderedPagesVerified:false,fullVisualReview:false,gameQuestionsChanged:false,previousBatchReportsChanged:false,sourceQueue:{repository:'kameralog/kameralog.github.io',commit:queueCommit,directory:queueDirectory,lists:queueFiles,selection:'Concatenate lists in order; zero-based slice(200,250)'},originalRecords,reviewResults:results,remainingChecks:['live_publication','rendered_artist_pages'],notes:['Все 50 файлов найдены и прошли браузерную загрузку; полный визуальный просмотр не заявляется.','После основных проверок браузерный сервис достиг лимита: дополнительные сравнения исходников №217 и №239 не выполнены.','№235 уже подключён: старый ключ, изображение и текст сохранены.','№238 не добавлен к Каналетто: автор в источниках — Бернардо Беллотто; надёжная привязка к отдельной карточке пока не подтверждена.','№234 отложен из-за расхождения подписи файла с описанием сцены в музейной карточке.','№215: правильное собрание — Spencer Museum of Art; название не дополнено словами с Младенцем.','№205: датировка 1518 по музею. Современные даты файлов №216 и №245 не использованы как даты произведений.','№216: CC0, фотограф Gleb Simonov. Для №230 дополнительно сохранены GFDL и CC BY-SA 3.0-migrated.','45 — число новых привязок репродукций, не утверждение о 45 независимых физических объектах.']};
