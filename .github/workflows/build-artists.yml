name: Build artists.js
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/painting/**'
      - '.github/workflows/build-artists.yml'
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: painting-build
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.catalogue.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build latest main and commit with bounded retries
        id: catalogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            (
              cd games/painting
              node install-reviewed-reproductions.mjs --test
              node install-reviewed-reproductions.mjs
              node install-package-reproductions.mjs --test
              node install-package-reproductions.mjs
              node update-guide.mjs
              node order-sections.mjs
              node search-artists.mjs
              node install-registry-visibility.mjs --test
              node install-registry-visibility.mjs
              node build-artists.mjs
              node --input-type=module --check < player-auth.js
              node --input-type=module --check < player-cabinet.js
              node --input-type=module --check < player-layout.js
              node install-player-auth.mjs --test
              node install-player-auth.mjs
              node --input-type=module --check < player-saves.js
              node --input-type=module --check < player-save-controls.js
              node install-save-controls.mjs
            )
            git add games/painting/artists.js games/painting/index.html games/painting/cabinet.html games/painting/player-cabinet.js games/painting/artists-batch-77.js games/painting/artists-batch-82.js games/painting/artists-batch-83.js games/painting/artists-batch-87.js games/painting/artists-batch-89.js games/painting/artists-batch-107.js games/painting/artists-batch-92.js games/painting/artists-batch-51.js games/painting/artists-batch-106.js games/painting/artists-batch-76.js games/painting/artists-batch-54.js games/painting/artists-batch-78.js games/painting/artists-batch-81.js games/painting/artists-batch-58.js games/painting/artists-batch-84.js games/painting/artists-batch-102.js games/painting/artists-batch-95.js games/painting/artists-batch-80.js games/painting/artists-batch-79.js
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "Build artists and repair registry visibility"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep "$((attempt * 3))"
          done
          test "$published" = true
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Catalogue built at $(git rev-parse HEAD); Pages publication is not yet verified." >> "$GITHUB_STEP_SUMMARY"
  verify_pages:
    name: Verify Pages publication
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    concurrency:
      group: painting-pages-verification
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - name: Check Pages source and request a build
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          timeout 30s gh api "$endpoint" > "$RUNNER_TEMP/pages.json"
          mode=$(jq -r '.build_type // "legacy"' "$RUNNER_TEMP/pages.json")
          if [ "$mode" != legacy ]; then
            echo "::error::Pages is not using legacy branch publishing. No settings changed."
            exit 1
          fi
          test "$(jq -r '.source.branch' "$RUNNER_TEMP/pages.json")" = main
          test "$(jq -r '.source.path' "$RUNNER_TEMP/pages.json")" = /
          requested=false
          for attempt in 1 2 3 4 5; do
            if timeout 30s gh api --method POST "$endpoint/builds" > "$RUNNER_TEMP/build-request.json" 2> "$RUNNER_TEMP/build-request-error"; then
              requested=true
              break
            fi
            cat "$RUNNER_TEMP/build-request-error" >&2
            if ! grep -Eq 'HTTP (409|429|500|502|503|504)' "$RUNNER_TEMP/build-request-error"; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          if [ "$requested" != true ]; then
            echo "::error::Pages did not accept a build request. No publication success claimed."
            exit 1
          fi
          echo "Pages build requested; publication is not yet verified."
      - name: Verify deployed content, not exact commit equality
        shell: bash
        run: |
          set -euo pipefail
          base=$(jq -r '.html_url' "$RUNNER_TEMP/pages.json")
          case "$base" in https://*) ;; *) echo "Invalid Pages URL" >&2; exit 1;; esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          grep -q 'registry-visibility:start' games/painting/index.html
          deadline=$((SECONDS + 480))
          reason="No Pages response yet"
          for attempt in $(seq 1 30); do
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            if ! timeout 20s gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/pages-build.json"; then
              reason="Pages API request failed"
              echo "attempt=$attempt reason=$reason"
              sleep 10
              continue
            fi
            status=$(jq -r '.status // "unknown"' "$RUNNER_TEMP/pages-build.json")
            commit=$(jq -r '.commit // "unknown"' "$RUNNER_TEMP/pages-build.json")
            echo "attempt=$attempt status=$status deployed_commit=$commit expected_snapshot=$EXPECTED_COMMIT"
            reason="Pages status is $status"
            if [ "$status" = errored ]; then
              jq '.error' "$RUNNER_TEMP/pages-build.json" >&2
              echo "::error::Latest Pages build errored. No publication success claimed."
              exit 1
            fi
            if [ "$status" = built ]; then
              if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Invalid commit returned by Pages."
                exit 1
              fi
              if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
                if ! timeout 25s git fetch --no-tags origin "$commit"; then
                  reason="Could not fetch the deployed commit"
                  echo "reason=$reason"
                  sleep 10
                  continue
                fi
              fi
              if ! git diff --quiet "$EXPECTED_COMMIT" "$commit" -- games/painting/artists.js games/painting/index.html; then
                reason="Deployed commit has different catalogue or index content"
              elif ! curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 "${base%/}/games/painting/artists.js?v=$commit" -o "$RUNNER_TEMP/live-artists.js"; then
                reason="Live artists.js download failed"
              elif ! cmp -s games/painting/artists.js "$RUNNER_TEMP/live-artists.js"; then
                reason="Live artists.js differs from the expected snapshot"
              elif ! curl --fail --silent --show-error --location --connect-timeout 5 --max-time 15 "${base%/}/games/painting/?v=$commit" -o "$RUNNER_TEMP/live-index.html"; then
                reason="Live index download failed"
              elif ! cmp -s games/painting/index.html "$RUNNER_TEMP/live-index.html"; then
                reason="Live index differs from the expected snapshot"
              elif ! grep -q 'registry-visibility:start' "$RUNNER_TEMP/live-index.html"; then
                reason="Live registry visibility marker is missing"
              else
                echo "Verified catalogue and index content for snapshot $EXPECTED_COMMIT; Pages build $commit."
                echo "Verified catalogue and index content for snapshot $EXPECTED_COMMIT; Pages build $commit. This is not a browser or image-delivery test." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "reason=$reason"
            sleep 10
          done
          echo "::error::Pages publication not verified: $reason. No success claimed."
          echo "Pages publication NOT verified for snapshot $EXPECTED_COMMIT: $reason" >> "$GITHUB_STEP_SUMMARY"
          exit 1
