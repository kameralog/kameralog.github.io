name: Build artists.js
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/painting/artists-batch-*.js'
      - 'games/painting/build-artists.mjs'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build artists.js and switch loader
        working-directory: games/painting
        run: node build-artists.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/painting/artists.js games/painting/index.html
          git diff --cached --quiet || git commit -m "Build artists.js from batches"
          git push
