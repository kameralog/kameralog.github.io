name: Build artists.js
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/painting/**'
      - '.github/workflows/build-artists.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: painting-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build latest main and commit with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            (
              cd games/painting
              node update-guide.mjs
              node order-sections.mjs
              node search-artists.mjs
              node install-registry-visibility.mjs --test
              node install-registry-visibility.mjs
              node build-artists.mjs
              node --input-type=module --check < player-auth.js
              node --input-type=module --check < player-cabinet.js
              node --input-type=module --check < player-layout.js
              node install-player-auth.mjs --test
              node install-player-auth.mjs
              node --input-type=module --check < player-saves.js
              node --input-type=module --check < player-save-controls.js
              node install-save-controls.mjs
            )
            git add games/painting/artists.js games/painting/index.html games/painting/cabinet.html games/painting/player-cabinet.js
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m "Build artists and repair registry visibility"
            if git push origin HEAD:main; then
              published=true
              break
            fi
            sleep "$((attempt * 3))"
          done
          test "$published" = true
          echo "EXPECTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Recover known blocked deployment and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/pages"
          gh api "$endpoint" > "$RUNNER_TEMP/pages.json"
          mode=$(jq -r '.build_type // "legacy"' "$RUNNER_TEMP/pages.json")
          if [ "$mode" != legacy ]; then
            echo "::error::Pages uses workflow publishing. No settings changed; a custom deployment workflow is required."
            exit 1
          fi
          test "$(jq -r '.source.branch' "$RUNNER_TEMP/pages.json")" = main
          test "$(jq -r '.source.path' "$RUNNER_TEMP/pages.json")" = /
          known="$endpoint/deployments/3b73a78ac2efb8d60e4a83243447bb1cc79a39fc"
          if gh api "$known" > "$RUNNER_TEMP/known-deployment.json" 2> "$RUNNER_TEMP/pages-error"; then
            status=$(jq -r '.status // empty' "$RUNNER_TEMP/known-deployment.json")
            case "$status" in
              succeed|success|failed|errored|canceled|cancelled) ;;
              queued|deployment_queued|deployment_in_progress|syncing_files|finished_file_sync|updating_pages)
                if ! gh api --method POST "$known/cancel" > "$RUNNER_TEMP/cancel-result" 2> "$RUNNER_TEMP/cancel-error"; then
                  if grep -Eq 'HTTP (404|409)' "$RUNNER_TEMP/cancel-error"; then
                    echo "::warning::Known deployment changed state during cancellation; requesting a new build."
                  else
                    cat "$RUNNER_TEMP/cancel-error" >&2
                    exit 1
                  fi
                fi
                ;;
              "") echo "::warning::Known deployment returned no status; no cancellation attempted. Requesting a new build." ;;
              *) echo "::warning::Unrecognized deployment status '$status'; no cancellation attempted. Requesting a new build." ;;
            esac
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error"; then
            cat "$RUNNER_TEMP/pages-error" >&2
            exit 1
          fi
          requested=false
          for attempt in 1 2 3 4 5; do
            if gh api --method POST "$endpoint/builds" > "$RUNNER_TEMP/build-request.json" 2> "$RUNNER_TEMP/build-request-error"; then
              requested=true
              break
            fi
            cat "$RUNNER_TEMP/build-request-error" >&2
            if ! grep -Eq 'HTTP (409|429|500|502|503|504)' "$RUNNER_TEMP/build-request-error"; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          if [ "$requested" != true ]; then
            echo "::error::Pages did not accept the new build request after five attempts."
            exit 1
          fi
      - name: Verify published catalogue and visibility patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(jq -r '.html_url' "$RUNNER_TEMP/pages.json")
          case "$base" in https://*) ;; *) echo "Invalid Pages URL" >&2; exit 1;; esac
          for attempt in $(seq 1 90); do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/pages-build.json"
            status=$(jq -r '.status' "$RUNNER_TEMP/pages-build.json")
            commit=$(jq -r '.commit' "$RUNNER_TEMP/pages-build.json")
            if [ "$status" = errored ] && [ "$commit" = "$EXPECTED_COMMIT" ]; then
              jq '.error' "$RUNNER_TEMP/pages-build.json" >&2
              exit 1
            fi
            if [ "$status" = built ] && [ "$commit" = "$EXPECTED_COMMIT" ] &&
              curl --fail --silent --show-error --location --max-time 20 "${base%/}/games/painting/artists.js?v=$EXPECTED_COMMIT" -o "$RUNNER_TEMP/live-artists.js" &&
              cmp -s games/painting/artists.js "$RUNNER_TEMP/live-artists.js" &&
              curl --fail --silent --show-error --location --max-time 20 "${base%/}/games/painting/?v=$EXPECTED_COMMIT" -o "$RUNNER_TEMP/live-index.html" &&
              grep -q 'registry-visibility:start' "$RUNNER_TEMP/live-index.html"; then
              echo "Published catalogue matches $EXPECTED_COMMIT; registry visibility patch is present."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Pages publication not verified within polling window. No success claimed."
          exit 1
